    <h1>Auto BGM Uploader</h1>
    <p>
      本アプリは、AIで生成したオリジナルBGMを
      YouTubeに自動アップロードする個人用ツールです。
    </p>

    <h2>機能</h2>
    <ul>
      <li>AIによるBGM生成</li>
      <li>背景画像と音楽の動画合成</li>

      本アプリは管理者本人のYouTubeチャンネルを識別し、
